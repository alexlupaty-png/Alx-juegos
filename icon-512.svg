<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A3A1A"/>
      <stop offset="50%" style="stop-color:#2D5A2D"/>
      <stop offset="100%" style="stop-color:#0D2210"/>
    </linearGradient>
    <radialGradient id="glow-bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:rgba(106,174,106,0.2)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A853"/>
      <stop offset="100%" style="stop-color:#F0C060"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Glow overlay -->
  <rect width="512" height="512" rx="100" fill="url(#glow-bg)"/>
  <!-- Border -->
  <rect x="8" y="8" width="496" height="496" rx="95" fill="none" stroke="rgba(106,174,106,0.25)" stroke-width="4"/>
  <!-- Inner subtle ring -->
  <rect x="20" y="20" width="472" height="472" rx="85" fill="none" stroke="rgba(106,174,106,0.1)" stroke-width="2"/>
  <!-- Main leaf -->
  <text x="256" y="230" font-size="160" text-anchor="middle" dominant-baseline="middle">🌿</text>
  <!-- HERBAL -->
  <text x="256" y="320" font-family="Georgia, serif" font-size="52" font-weight="900" fill="white" text-anchor="middle" letter-spacing="8">HERBAL</text>
  <!-- KINGDOM -->
  <text x="256" y="370" font-family="Georgia, serif" font-size="32" font-weight="600" fill="#A8D5A8" text-anchor="middle" letter-spacing="10">KINGDOM</text>
  <!-- Divider line -->
  <line x1="140" y1="392" x2="372" y2="392" stroke="rgba(212,168,83,0.4)" stroke-width="1"/>
  <!-- BOLIVIA -->
  <text x="256" y="420" font-family="sans-serif" font-size="20" font-weight="600" fill="#D4A853" text-anchor="middle" letter-spacing="4">✦  BOLIVIA  ✦</text>
  <!-- Corner dots -->
  <circle cx="80" cy="80" r="6" fill="rgba(106,174,106,0.3)"/>
  <circle cx="432" cy="80" r="6" fill="rgba(106,174,106,0.3)"/>
  <circle cx="80" cy="432" r="6" fill="rgba(106,174,106,0.3)"/>
  <circle cx="432" cy="432" r="6" fill="rgba(106,174,106,0.3)"/>
</svg>
