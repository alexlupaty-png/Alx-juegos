<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A3A1A"/>
      <stop offset="100%" style="stop-color:#2D5A2D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A853"/>
      <stop offset="100%" style="stop-color:#F0C060"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <!-- Border ring -->
  <rect x="4" y="4" width="184" height="184" rx="38" fill="none" stroke="rgba(106,174,106,0.3)" stroke-width="2"/>
  <!-- Leaf icon -->
  <text x="96" y="90" font-size="60" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">🌿</text>
  <!-- HERBAL text -->
  <text x="96" y="126" font-family="serif" font-size="18" font-weight="900" fill="white" text-anchor="middle" letter-spacing="3">HERBAL</text>
  <!-- KINGDOM text -->
  <text x="96" y="146" font-family="serif" font-size="12" font-weight="600" fill="#A8D5A8" text-anchor="middle" letter-spacing="4">KINGDOM</text>
  <!-- Gold dots -->
  <circle cx="60" cy="158" r="3" fill="url(#gold)"/>
  <text x="96" y="162" font-family="sans-serif" font-size="8" fill="#D4A853" text-anchor="middle" letter-spacing="2">BOLIVIA</text>
  <circle cx="132" cy="158" r="3" fill="url(#gold)"/>
</svg>
